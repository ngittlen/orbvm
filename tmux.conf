set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 10
set -g mouse on

# Use vi keys in copy mode
setw -g mode-keys vi

# Send copied text to the Mac clipboard through OrbStack's pbcopy
set -s copy-command 'mac pbcopy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Also copy over OSC 52 (works over SSH, if your terminal allows it)
set -g set-clipboard on

# Apps such as Claude Code copy over OSC 52, which fills a tmux buffer without
# running copy-command, so send those buffers to the Mac clipboard as well
set-hook -g pane-set-clipboard 'run -b "tmux save-buffer - | mac pbcopy"'

# Name windows running Claude Code after the title Claude gives its session,
# prefixed with its state from the Claude Code hooks: ● busy, ? waiting on you, ✳ idle
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},claude},#{?#{==:#{@claude_state},busy},● ,#{?#{==:#{@claude_state},waiting},? ,✳ }}#{=40:#{s/^✳ //:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}'

# Show the current window's name as the Ghostty tab title
set -g set-titles on
set -g set-titles-string '#{session_name}: #{window_name}'
